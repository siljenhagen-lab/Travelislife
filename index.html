<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#005f6a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Siljesreiser">
<title>Siljesreiser</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="lib/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1>Siljesreiser</h1>
  <nav>
    <a href="#kart" data-page="kart">Kart</a>
    <a href="#stats" data-page="stats">Stats</a>
  </nav>
</header>

<main>
  <section id="page-kart" class="page">
    <div id="map"></div>
    <div class="search">
      <input id="search" type="search" placeholder="Søk etter land eller by …" autocomplete="off">
      <ul id="results" hidden></ul>
    </div>
    <div class="legend">
      <span><i class="sw want"></i>Ønsker</span>
      <span><i class="sw been"></i>Har vært</span>
      <span><i class="dot want"></i>By ønsker</span>
      <span><i class="dot been"></i>By vært</span>
    </div>
    <div id="panel" class="panel" hidden>
      <button class="close" id="panel-close" aria-label="Lukk">×</button>
      <div class="panel-kind" id="panel-kind"></div>
      <h2 id="panel-title"></h2>
      <div class="panel-sub" id="panel-sub"></div>
      <div class="actions">
        <button data-status="been" class="btn been">Har vært</button>
        <button data-status="want" class="btn want">Ønsker å reise</button>
        <button data-status="" class="btn clear">Fjern</button>
      </div>
    </div>
  </section>

  <section id="page-stats" class="page" hidden>
    <div class="stats-wrap">
      <div class="stats-grid">
        <div class="card been">
          <h2>Har vært</h2>
          <div class="nums">
            <div><b id="been-cities">0</b><span>byer/steder</span></div>
            <div><b id="been-countries">0</b><span>land</span></div>
            <div><b id="been-continents">0</b><span>verdensdeler</span></div>
          </div>
        </div>
        <div class="card want">
          <h2>Ønsker</h2>
          <div class="nums">
            <div><b id="want-cities">0</b><span>byer/steder</span></div>
            <div><b id="want-countries">0</b><span>land</span></div>
            <div><b id="want-continents">0</b><span>verdensdeler</span></div>
          </div>
        </div>
      </div>
      <div class="lists">
        <div><h3>Har vært</h3><div id="been-list"></div></div>
        <div><h3>Ønsker</h3><div id="want-list"></div></div>
      </div>
      <div class="backup">
        <button id="export" class="btn clear">Last ned sikkerhetskopi</button>
        <label class="btn clear">Gjenopprett fra fil<input id="import" type="file" accept="application/json" hidden></label>
      </div>
    </div>
  </section>
</main>

<script src="lib/leaflet/leaflet.js"></script>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
